name: personal_finance_tracker
description: "Personal Finance Tracker - Aplikasi pencatatan keuangan pribadi dengan integrasi Telegram Bot dan Groq AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & API
  dio: ^5.7.0

  # Navigation
  go_router: ^14.3.0

  # Secure Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI Components
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2802.4
  fl_chart: ^0.69.0
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  go_router_builder: ^2.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Optional custom font: unduh font Inter dari fonts.google.com dan letakkan di assets/fonts/
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

